# Publishes a signed installer for ONE product as a GitHub Release.
# This repository serves several products. Each product has its own folder on main: <slug>/version.json.
#
# Trigger: push of a short-lived branch  incoming/<slug>-v<version>  that contains
#   incoming/<slug>/<installer>.exe, incoming/<slug>/version.json, incoming/<slug>/notes.md
# Only that product folder is processed. The release, tag (<slug>-v<version>) and assets are created
# with GITHUB_TOKEN (shown as github-actions[bot]). Afterwards the bot commits <slug>/version.json to main
# and deletes the incoming branch, so main never holds installers.
name: publish

on:
  push:
    branches: ['incoming/*-v*']

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify installer (product folder, hash, signature, publisher, EKU, timestamp)
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ("$env:GITHUB_REF_NAME" -notmatch '^incoming/([a-z0-9][a-z0-9-]*)-v(\d+\.\d+\.\d+)$') { throw "branch must be incoming/<slug>-v<x.y.z>" }
          $slug = $Matches[1]; $ver = $Matches[2]
          $dir = "incoming/$slug"
          $others = @(Get-ChildItem incoming -Directory | Where-Object Name -ne $slug)
          if ($others.Count) { throw "only one product folder per push (found: $($others.Name -join ', '))" }
          $m = Get-Content "$dir/version.json" -Raw | ConvertFrom-Json
          foreach ($k in 'version','product','file','sha256','url') { if (-not $m.$k) { throw "version.json: missing '$k'" } }
          if ($m.version -ne $ver) { throw "version.json version $($m.version) != branch $ver" }
          if ($m.product -ne $slug) { throw "version.json product $($m.product) != folder $slug" }
          $f = Join-Path $dir $m.file
          if (-not (Test-Path -LiteralPath $f)) { throw "installer not found: $($m.file)" }
          $h = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $m.sha256.ToLower()) { throw "sha256 mismatch" }
          $tag = "$slug-v$ver"
          $want = "https://github.com/${{ github.repository }}/releases/download/$tag/$($m.file)"
          if ($m.url -ne $want) { throw "url must be $want" }
          $s = Get-AuthenticodeSignature -LiteralPath $f
          if ("$($s.Status)" -ne 'Valid') { throw "signature status: $($s.Status)" }
          if (-not $s.TimeStamperCertificate) { throw "no timestamp" }
          if ($s.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Myung Shin(,|$)') { throw "unexpected publisher" }
          $eku = $s.SignerCertificate.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' }
          if (-not ($eku.EnhancedKeyUsages.Value -contains '1.3.6.1.4.1.311.97.880848874.937312352.607266834.698134517')) { throw "profile EKU missing" }
          if (-not (Test-Path "$dir/notes.md")) { throw "$dir/notes.md missing" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "release $tag already exists (no overwrite)" }
          $global:LASTEXITCODE = 0
          "slug=$slug" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "file=$f" >> $env:GITHUB_OUTPUT
          "OK: $tag $($m.file) $h"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $slug = '${{ steps.verify.outputs.slug }}'
          # --latest=false: several products share this repository, so no single "latest" release.
          gh release create '${{ steps.verify.outputs.tag }}' '${{ steps.verify.outputs.file }}' "incoming/$slug/version.json" `
            --title '${{ steps.verify.outputs.tag }}' --notes-file "incoming/$slug/notes.md" --target main --latest=false
          if ($LASTEXITCODE -ne 0) { throw "release failed" }

      - name: Record <slug>/version.json on main and remove the incoming branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $slug = '${{ steps.verify.outputs.slug }}'
          Copy-Item "incoming/$slug/version.json" "$env:RUNNER_TEMP/version.json"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Force $slug | Out-Null
          Copy-Item "$env:RUNNER_TEMP/version.json" "$slug/version.json" -Force
          git add "$slug/version.json"
          git commit -m "$slug ${{ steps.verify.outputs.ver }}"
          git push origin main
          git push origin --delete "$env:GITHUB_REF_NAME"
